<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OOGO 真奇门排盘</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=9">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png?v=9">
  <link rel="manifest" href="./manifest.json">
  <style>
    /* 暗黑主题 */
    :root {
      --bg-main: #131520;
      --panel-bg: #1d1e2e;
      --border-color: #2b2c40;
      --gold-line: #a6833b;
      --cell-bg: #13141d;
      --text-main: #ffffff;
      --text-gray: #9ca3af;
      --text-blue: #5b92d6;
      --text-gold: #e2b45f;
      --c-deity: #d48b57;
      --c-star: #5c92d1;
      --c-gate-g: #25b955;
      --c-gate-r: #d34e55;
      --c-gate-n: #a881d8;
      --c-stem-h: #d18a99;
      --c-stem-e: #ffffff;
      --tag-ma-bg: #d34e55;
      --tag-kong-bg: #7a7a90;
      --palace-text: #7a7a90;
      --edeity-text: #c4b5a2;
      --dark-stem-color: #818cf8;
      --dark-stem-bg: rgba(129, 140, 248, 0.1);
      
      /* 五行颜色 (暗黑主题下更亮眼清晰) */
      --wx-wood: #22c55e;   /* 木：绿色 */
      --wx-fire: #ef4444;   /* 火：红色 */
      --wx-earth: #d97706;  /* 土：泥土棕黄色 */
      --wx-metal: #fbbf24;  /* 金：金黄色 */
      --wx-water: #3b82f6;  /* 水：蓝色 */
    }

    body.light-theme {
      --bg-main: #f0f2f5;
      --panel-bg: #ffffff;
      --border-color: #d1d5db;
      --gold-line: #b8975c;
      --cell-bg: #ffffff;
      --text-main: #111827;
      --text-gray: #6b7280;
      --text-blue: #2563eb;
      --text-gold: #d97706;
      --c-deity: #d97706;
      --c-star: #2563eb;
      --c-gate-g: #16a34a;
      --c-gate-r: #dc2626;
      --c-gate-n: #632914;
      --c-stem-h: #9d174d;
      --c-stem-e: #111827;
      --palace-text: #9ca3af;
      --edeity-text: #8b5cf6;
      --dark-stem-color: #4f46e5;
      --dark-stem-bg: rgba(79, 70, 229, 0.08);

      /* 五行颜色 (亮色主题下适当加深以保证对比度) */
      --wx-wood: #16a34a;   /* 木：绿色 */
      --wx-fire: #dc2626;   /* 火：红色 */
      --wx-earth: #b45309;  /* 土：深泥土棕色 */
      --wx-metal: #d97706;  /* 金：深金黄色 */
      --wx-water: #2563eb;  /* 水：蓝色 */
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; padding: 5px; background: var(--bg-main); color: var(--text-main); margin: 0 auto; max-width: 100%; transition: background 0.3s, color 0.3s; box-sizing: border-box; }
    .top-ctrl { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; transition: all 0.3s; }
    .ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; width: 100%; box-sizing: border-box; }
    .badge { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
    .badge-gong, .badge-nong, .badge-zhen { background: rgba(91, 146, 214, 0.15); color: var(--text-blue); }
    
    .date-group { display: flex; align-items: center; flex: 1; justify-content: space-between; gap: 2px; min-width: 0; }
    .date-item { display: flex; align-items: center; flex: 1; min-width: 0; }
    .date-item.year-item { flex: 1.3; } 
    select.date-input { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); height: 26px; border-radius: 4px; font-size: 13px; font-weight: bold; outline: none; appearance: none; -webkit-appearance: none; padding: 0; text-align: center; text-align-last: center; cursor: pointer; width: 100%; min-width: 0; }
    .date-text { color: var(--text-gray); font-size: 13px; margin: 0 1px 0 2px; flex-shrink: 0; }
    .btn-red { background: #d34e55; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 52px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
    .btn-big-start { background: var(--text-gold); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.2); width: 52px; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; transition: 0.2s; flex-shrink: 0; padding: 0; }
    .btn-big-start:active { transform: scale(0.95); opacity: 0.9; }
    .zhen-group { display: flex; flex: 1; gap: 4px; min-width: 0; }
    .zhen-item { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; padding: 0 4px; display: flex; align-items: center; justify-content: center; height: 30px; box-sizing: border-box; min-width: 0; }
    .zhen-item input[type="checkbox"] { margin-right: 4px; accent-color: var(--text-blue); }
    .zhen-item select, .zhen-item input[type="number"] { background: transparent; border: none; color: var(--text-main); width: 100%; height: 30px; line-height: 30px; text-align: center; outline: none; font-size: 13px; -webkit-appearance: none; appearance: none; padding: 0; margin: 0; }
    .zhen-item select { color: var(--text-blue); text-align-last: center; }
    .sub-ctrl { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 0; gap: 4px; }
    .sub-text { color: var(--text-gray); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
    .select-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .select-group select { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-blue); padding: 0 6px; height: 26px; line-height: 24px; border-radius: 4px; font-size: 13px; outline: none; -webkit-appearance: none; appearance: none; text-align: center; }
    .btn-theme { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 0 6px; height: 26px; line-height: 24px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .info-board { margin-bottom: 15px; }
    .bazi-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .bazi-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 23%; text-align: center; padding: 8px 0; transition: all 0.3s; }
    .bazi-title { font-size: 13px; color: var(--text-gray); margin-bottom: 6px; }
    .bazi-value { font-size: 16px; font-weight: bold; color: var(--text-gold); }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; }
    .zhifu-row { margin: 12px 0; }
    .pill-green { background: rgba(37, 185, 85, 0.1); color: var(--c-gate-g); border: 1px solid var(--c-gate-g); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .circle-logo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--text-gold); background: var(--panel-bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 8px rgba(226,180,95,0.2); }
    .circle-logo:active { transform: scale(0.9); background: var(--text-gold); color: #000; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--gold-line); border: 1px solid var(--gold-line); border-radius: 4px; padding: 1px; }
    .cell { background: var(--cell-bg); position: relative; height: 125px; box-sizing: border-box; transition: background 0.3s; overflow: hidden; transform: translateZ(0); backface-visibility: hidden; }
    .center-cell { background: var(--cell-bg); display: flex; justify-content: center; align-items: center; position: relative; transition: background 0.3s; overflow: hidden; transform: translateZ(0); backface-visibility: hidden; }
    .corner { position: absolute; font-size: 13px; }
    .hidden-stem-text { color: var(--dark-stem-color); font-weight: bold; font-size: 13px; }
    .top-right { position: absolute; top: 1px; right: 1px; display: flex; gap: 3px; align-items: center; font-weight: bold; z-index: 10; }
    .palace-row { position: absolute; bottom: 6px; left: 14px; right: 14px; border-top: 1px dashed var(--border-color); padding-top: 4px; display: flex; justify-content: space-between; align-items: center; color: var(--palace-text); font-size: 13px; z-index: 10; }
    .inner-content { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 28px); display: flex; flex-direction: column; gap: 9px; z-index: 10; }
    .deity-text { font-size: 21px; }
    .star-text  { font-size: 18px; }
    .gate-text  { font-size: 18px; }
    .taichi-svg { width: 115px; height: 115px; filter: drop-shadow(0 0 8px rgba(0,0,0,0.4)); }
    .tag-ma { color: #ffffff; background: #d34e55; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-weight: bold; border: none; box-shadow: none; }
    .tag-kong { color: #ffffff; background: #7a7a90; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-weight: bold; border: none; box-shadow: none; }
    .tag-jx { color: #ffffff; background: #8b5cf6; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-weight: bold; border: none; box-shadow: none; }
    .tag-mu { color: #ffffff; background: #374151; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-weight: bold; border: none; box-shadow: none; }
    .tag-po { color: #ffffff; background: #d97706; padding: 1px 4px; border-radius: 3px; font-size: 12px; font-weight: bold; border: none; box-shadow: none; }
    .row { display: flex; justify-content: space-between; align-items: flex-end; }
    .left-item { text-align: left; font-weight: bold; line-height: 1; white-space: nowrap; letter-spacing: 1px; }
    .right-item { text-align: right; font-size: 14px; font-weight: bold; line-height: 1; white-space: nowrap; }
    .small-stem { font-size: 12px !important; letter-spacing: -1px; }
    .edeity-text { font-size: 13px; color: var(--edeity-text); font-weight: bold; }
    .deity { color: var(--c-deity); }
    .star { color: var(--c-star); }
    .gate-g { color: var(--c-gate-g); }
    .gate-r { color: var(--c-gate-r); }
    .gate-n { color: var(--c-gate-n); }
    .stem-h { color: var(--c-stem-h); }
    .stem-e { color: var(--c-stem-e); }

    @media (min-width: 600px) {
      body { max-width: 520px; padding: 16px; }
      .cell { height: 145px; }
      .deity-text { font-size: 23px; }
      .star-text  { font-size: 20px; }
      .gate-text  { font-size: 20px; }
      .taichi-svg { width: 130px; height: 130px; }
    }
  </style>

  <!-- 依赖库与外部算法引擎 -->
  <script src="https://cdn.jsdelivr.net/gh/usaleo/oogo-qimen@main/8oogo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/usaleo/oogo-qimen@main/html2canvas.min.js"></script>
  <script src="./oogo-zhirun.js"></script>
</head>

        <div id="jieqiRange" style="white-space: nowrap; font-size: min(11.5px, 2.9vw); font-weight: bold; color: var(--text-main); letter-spacing: -0.2px;">

          <div class="select-group">
            <select id="methodSelect" onchange="onSelectChange()">
              <option value="zhirun" selected>置闰法</option>
              <option value="chaibu">拆补法</option>

              <option value="zhuan" selected>转盘</option>

  <script>
    window.onerror = function(msg, url, line) {
       console.error("系统错误: " + msg + " (行: " + line + ")");
    };

    let isChartGenerated = false;

    function onSelectChange() {
        if (isChartGenerated) {
            generateChart();
        }
    }

    function initDateSelects() {
  try {
      const y = document.getElementById('selY'); for(let i=1900; i<=2100; i++) y.add(new Option(i, i));
      const m = document.getElementById('selM'); for(let i=1; i<=12; i++) m.add(new Option(pad(i), i));   // 月：01 - 12
      const d = document.getElementById('selD'); for(let i=1; i<=31; i++) d.add(new Option(pad(i), i));   // 日：01 - 31
      const h = document.getElementById('selH'); for(let i=0; i<=23; i++) h.add(new Option(pad(i), i));   // 时：00 - 23
      const min = document.getElementById('selMin'); for(let i=0; i<=59; i++) min.add(new Option(pad(i), i)); // 分：00 - 59
  } catch(e) {}
}

    function pad(n) { return n < 10 ? '0' + n : n; }
    initDateSelects();

    // 统一获取当前选择的生效时间对象（自动判断并加上真太阳时差）
    function getEffectiveDate() {
      let yIn = parseInt(document.getElementById('selY').value);
      let mIn = parseInt(document.getElementById('selM').value);
      let dIn = parseInt(document.getElementById('selD').value);
      let hIn = parseInt(document.getElementById('selH').value);
      let minIn = parseInt(document.getElementById('selMin').value);

      let dDate = new Date(yIn, mIn - 1, dIn, hIn, minIn, 0);
      let lng = parseFloat(document.getElementById('longitude').value);
      if (document.getElementById('useTrueSolar').checked && !isNaN(lng)) { 
        dDate.setMinutes(dDate.getMinutes() + (lng - 120) * 4); 
      }
      return dDate;
    }

    // 五行颜色匹配函数（金=金黄、土=泥土深黄/棕色、木=绿、火=红、水=蓝）
    function getWuxingColor(char) {
      if (['甲', '乙', '寅', '卯'].includes(char)) return 'var(--wx-wood)';   // 木：绿
      if (['丙', '丁', '巳', '午'].includes(char)) return 'var(--wx-fire)';   // 火：红
      if (['戊', '己', '辰', '戌', '丑', '未'].includes(char)) return 'var(--wx-earth)'; // 土：泥土深黄/棕色
      if (['庚', '辛', '申', '酉'].includes(char)) return 'var(--wx-metal)'; // 金：金黄色
      if (['壬', '癸', '亥', '子'].includes(char)) return 'var(--wx-water)'; // 水：蓝
      return 'inherit';
    }

    // 格式化四柱（天干地支按五行上色，支持黑白主题动态自适应）
    function formatPillar(pillarStr) {
      if (!pillarStr) return '';
      let stem = pillarStr[0] || '';
      let branch = pillarStr[1] || '';
      return `<span style="color: ${getWuxingColor(stem)}">${stem}</span><span style="color: ${getWuxingColor(branch)}">${branch}</span>`;
    }

    function renderDefaultBoard() {
      const grid = document.getElementById('chartGrid');
      grid.style.background = 'transparent';
      grid.style.border = 'none';
      grid.style.display = 'flex';
      grid.style.justifyContent = 'center';
      grid.style.alignItems = 'center';
      grid.style.padding = '10px';

      grid.innerHTML = `
        <div style="width: 100%; max-width: 420px; aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center;">
          <svg viewBox="0 0 200 200" style="width: 100%; height: 100%; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));">
            <path d="M 100 0 A 100 100 0 0 1 100 200 A 50 50 0 0 1 100 100 A 50 50 0 0 0 100 0 Z" fill="#000000"/>
            <path d="M 100 200 A 100 100 0 0 1 100 0 A 50 50 0 0 1 100 100 A 50 50 0 0 0 100 200 Z" fill="#ffffff"/>
            <circle cx="100" cy="50" r="28" fill="#000000"/>
            <circle cx="100" cy="150" r="28" fill="#ffffff"/>
          </svg>
        </div>
      `;

      document.getElementById('infoBoard').innerHTML = 
        '<div class="info-row" style="justify-content: center; color: var(--text-gold); font-size: 15px; font-weight: bold; margin-bottom: 8px;"><span>👑 OOGO 奇门遁甲 👑</span></div>' +
        '<div class="info-row" style="justify-content: center; margin-bottom: 5px;"><span>太极生两仪，两仪生四象，四象生八卦</span></div>' +

    function updateDynamicInfo() {
      if (typeof ThreeMeta === 'undefined') return;
      try {
        let dDate = getEffectiveDate();
        let currentTimestamp = dDate.getTime();
        
        function getJQAt(ts) {
            let d = new Date(ts);
            return ThreeMeta.QimenChart.fromSolar(d.getFullYear(), d.getMonth()+1, d.getDate(), d.getHours(), d.getMinutes(), 0).timeInfo.solarTerm;
        }
        
        let currentJQ = getJQAt(currentTimestamp);
        let step = 24 * 3600 * 1000; 
        
        let startProbe = currentTimestamp;
        while (getJQAt(startProbe) === currentJQ) { startProbe -= step; }
        let left = startProbe, right = startProbe + step;
        while (right - left > 60000) { 
            let mid = Math.floor((left + right) / 2);
            if (getJQAt(mid) === currentJQ) { right = mid; } else { left = mid; }
        }
        let startTime = new Date(right);
        
        let endProbe = currentTimestamp;
        while (getJQAt(endProbe) === currentJQ) { endProbe += step; }
        let nextJQ = getJQAt(endProbe);
        left = endProbe - step; right = endProbe;
        while (right - left > 60000) {
            let mid = Math.floor((left + right) / 2);
            if (getJQAt(mid) === nextJQ) { right = mid; } else { left = mid; }
        }
        let endTime = new Date(right);
        
        function formatD(d) { return d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
        
        document.getElementById('jieqiRange').innerHTML = 
          currentJQ + ' ' + formatD(startTime) + 
          '<span style="color:var(--text-gray); margin:0 3px;">~</span>' + 
          nextJQ + ' ' + formatD(endTime);

      } catch (e) { console.error(e); }
    }

      if (!name) return '';

      const terms = { 1: d<5?"冬至":d<20?"小寒":"大寒", 2: d<4?"大寒":d<19?"立春":"雨水", 3: d<5?"雨水":d<20?"惊蛰":"春分", 4: d<5?"春分":d<20?"清明":"谷雨", 5: d<5?"谷雨":d<21?"立夏":"小满", 6: d<6?"小满":d<21?"芒种":"夏至", 7: d<7?"夏至":d<23?"小暑":"大暑", 8: d<7?"大暑":d<23?"立秋":"处暑", 9: d<7?"处暑":d<23?"白露":"秋分", 10: d<8?"秋分":d<23?"寒露":"霜降", 11: d<7?"霜降":d<22?"立冬":"小雪", 12: d<7?"小雪":d<22?"大雪":"冬至" };

              overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;';

              const tip = document.createElement('div');
              tip.innerText = '👉 请长按下方图片保存或分享 👈';
              tip.style.cssText = 'color:#e2b45f;font-size:16px;margin-bottom:15px;font-weight:bold;letter-spacing:1px;';

              const img = document.createElement('img');
              img.src = url;
              img.style.cssText = 'max-width:90%;max-height:80%;border-radius:8px;box-shadow:0 0 15px rgba(226,180,95,0.3);';

              const closeBtn = document.createElement('div');
              closeBtn.innerText = '✕ 关闭';
              closeBtn.style.cssText = 'color:#fff;margin-top:20px;padding:8px 24px;border:1px solid #7a7a90;border-radius:20px;font-size:14px;cursor:pointer;';
              closeBtn.onclick = function() {
                document.body.removeChild(overlay);
                setTimeout(function () { URL.revokeObjectURL(url); }, 100);
              };

              overlay.appendChild(tip);
              overlay.appendChild(img);
              overlay.appendChild(closeBtn);
              document.body.appendChild(overlay);
              
              showToast('✅ 图片生成成功，请长按保存');
            } else {
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              a.style.display = 'none';
              document.body.appendChild(a);
              a.click(); 
              document.body.removeChild(a);
              
              setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
              showToast('✅ 图片已开始下载');
            }
          }, 'image/png', 0.92);

        }).catch(function (err) {
          body.style.overflow = originalOverflow;
          if (logo) { logo.innerText = '历'; logo.style.fontSize = '14px'; }
          alert('生成图片失败：' + (err && err.message ? err.message : '未知错误'));
        });
      }, 150);
    }


    function showToast(msg) {
      const old = document.getElementById('qimenToast');
      if (old) old.remove();
      const toast = document.createElement('div');
      toast.id = 'qimenToast';
      toast.innerText = msg;
      toast.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:100000;pointer-events:none;white-space:nowrap;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
      document.body.appendChild(toast);
      setTimeout(function () { toast.remove(); }, 2500);
    }
  </script>
</body>
</html>
