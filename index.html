<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OOGO 真奇门排盘</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=9">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png?v=9">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg-main: #131520; --panel-bg: #1d1e2e; --border-color: #2b2c40; --gold-line: #a6833b; --cell-bg: #13141d; --text-main: #ffffff; --text-gray: #7a7a90; --text-blue: #5b92d6; --text-gold: #e2b45f; --c-deity: #d48b57; --c-star: #5c92d1; --c-gate-g: #25b955; --c-gate-r: #d34e55; --c-gate-n: #a881d8; --c-stem-h: #d18a99; --c-stem-e: #ffffff; --tag-ma-bg: #d34e55; --tag-kong-bg: #7a7a90; --palace-text: #7a7a90; --edeity-text: #c4b5a2; --dark-stem-color: #818cf8; --dark-stem-bg: rgba(129, 140, 248, 0.1);
    }
    body.light-theme { --bg-main: #f0f2f5; --panel-bg: #ffffff; --border-color: #d1d5db; --gold-line: #b8975c; --cell-bg: #ffffff; --text-main: #111827; --text-gray: #6b7280; --text-blue: #2563eb; --text-gold: #d97706; --c-deity: #d97706; --c-star: #2563eb; --c-gate-g: #16a34a; --c-gate-r: #dc2626; --c-gate-n: #632914; --c-stem-h: #9d174d; --c-stem-e: #111827; --palace-text: #9ca3af; --edeity-text: #8b5cf6; --dark-stem-color: #4f46e5; --dark-stem-bg: rgba(79, 70, 229, 0.08); }
    body { font-family: -apple-system, sans-serif; padding: 10px; background: var(--bg-main); color: var(--text-main); margin: 0 auto; max-width: 100%; transition: background 0.3s, color 0.3s; box-sizing: border-box; }
    .top-ctrl { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; transition: all 0.3s; }
    .ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; width: 100%; box-sizing: border-box; }
    .badge { width: 24px; height: 24px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
    .badge-gong, .badge-nong, .badge-zhen { background: rgba(91, 146, 214, 0.15); color: var(--text-blue); }
    .date-group { display: flex; align-items: center; flex: 1; justify-content: space-between; gap: 2px; min-width: 0; }
    .date-item { display: flex; align-items: center; flex: 1; min-width: 0; }
    .date-item.year-item { flex: 1.3; } 
    select.date-input { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); height: 26px; border-radius: 4px; font-size: 13px; font-weight: bold; outline: none; appearance: none; -webkit-appearance: none; padding: 0; text-align: center; text-align-last: center; cursor: pointer; width: 100%; min-width: 0; }
    .date-text { color: var(--text-gray); font-size: 11px; margin: 0 1px 0 2px; flex-shrink: 0; }
    .btn-red { background: #d34e55; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; width: 52px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
    .btn-big-start { background: var(--text-gold); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.2); width: 52px; cursor: pointer; display: flex; align-items: center; justify-content: center; letter-spacing: 2px; transition: 0.2s; flex-shrink: 0; padding: 0; }
    .btn-big-start:active { transform: scale(0.95); opacity: 0.9; }
    .zhen-group { display: flex; flex: 1; gap: 4px; min-width: 0; }
    .zhen-item { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 6px; padding: 0 4px; display: flex; align-items: center; justify-content: center; height: 30px; box-sizing: border-box; min-width: 0; }
    .zhen-item input[type="checkbox"] { margin-right: 4px; accent-color: var(--text-blue); }
    .zhen-item select, .zhen-item input[type="number"] { background: transparent; border: none; color: var(--text-main); width: 100%; height: 30px; line-height: 30px; text-align: center; outline: none; font-size: 13px; -webkit-appearance: none; appearance: none; padding: 0; margin: 0; }
    .zhen-item select { color: var(--text-blue); text-align-last: center; }
    .sub-ctrl { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 8px; margin-top: 0; gap: 4px; }
    .sub-text { color: var(--text-gray); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
    .select-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .select-group select { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-blue); padding: 0 6px; height: 26px; line-height: 24px; border-radius: 4px; font-size: 11px; outline: none; -webkit-appearance: none; appearance: none; text-align: center; }
    .btn-theme { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 0 6px; height: 26px; line-height: 24px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .info-board { margin-bottom: 15px; }
    .bazi-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .bazi-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; width: 23%; text-align: center; padding: 8px 0; transition: all 0.3s; }
    .bazi-title { font-size: 11px; color: var(--text-gray); margin-bottom: 6px; }
    .bazi-value { font-size: 16px; font-weight: bold; color: var(--text-gold); }
    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; }
    .zhifu-row { margin: 12px 0; }
    .pill-green { background: rgba(37, 185, 85, 0.1); color: var(--c-gate-g); border: 1px solid var(--c-gate-g); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .circle-logo { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--text-gold); background: var(--panel-bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 8px rgba(226,180,95,0.2); }
    .circle-logo:active { transform: scale(0.9); background: var(--text-gold); color: #000; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--gold-line); border: 1px solid var(--gold-line); border-radius: 4px; padding: 1px; }
    .cell { background: var(--cell-bg); position: relative; height: 125px; box-sizing: border-box; transition: background 0.3s; overflow: hidden; }
    .center-cell { background: var(--cell-bg); display: flex; justify-content: center; align-items: center; position: relative; transition: background 0.3s; overflow: hidden;}
    .corner { position: absolute; font-size: 11px; }
    .hidden-stem-text { color: var(--dark-stem-color); font-weight: bold; font-size: 13px; }
    .top-right { position: absolute; top: 1px; right: 1px; display: flex; gap: 3px; align-items: center; font-weight: bold; z-index: 10; }
    .palace-row { position: absolute; bottom: 6px; left: 14px; right: 14px; border-top: 1px dashed var(--border-color); padding-top: 4px; display: flex; justify-content: space-between; align-items: center; color: var(--palace-text); font-size: 11px; z-index: 10; }
    .inner-content { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 28px); display: flex; flex-direction: column; gap: 9px; z-index: 10; }
    .deity-text { font-size: 21px; }
    .star-text  { font-size: 18px; }
    .gate-text  { font-size: 18px; }
    .taichi-svg { width: 115px; height: 115px; filter: drop-shadow(0 0 8px rgba(0,0,0,0.4)); }
    .tag-ma { color: #ffffff; background: #d34e55; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; border: none; box-shadow: none; }
    .tag-kong { color: #ffffff; background: #7a7a90; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; border: none; box-shadow: none; }
    .tag-jx { color: #ffffff; background: #8b5cf6; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; border: none; box-shadow: none; }
    .tag-mu { color: #ffffff; background: #374151; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; border: none; box-shadow: none; }
    .tag-po { color: #ffffff; background: #d97706; padding: 1px 4px; border-radius: 3px; font-size: 10px; font-weight: bold; border: none; box-shadow: none; }
    .row { display: flex; justify-content: space-between; align-items: flex-end; }
    .left-item { text-align: left; font-weight: bold; line-height: 1; white-space: nowrap; letter-spacing: 1px; }
    .right-item { text-align: right; font-size: 14px; font-weight: bold; line-height: 1; white-space: nowrap; }
    .small-stem { font-size: 12px !important; letter-spacing: -1px; }
    .edeity-text { font-size: 13px; color: var(--edeity-text); font-weight: bold; }
    .deity { color: var(--c-deity); }
    .star { color: var(--c-star); }
    .gate-g { color: var(--c-gate-g); }
    .gate-r { color: var(--c-gate-r); }
    .gate-n { color: var(--c-gate-n); }
    .stem-h { color: var(--c-stem-h); }
    .stem-e { color: var(--c-stem-e); }

    @media (min-width: 600px) {
      body { max-width: 520px; padding: 16px; }
      .cell { height: 145px; }
      .deity-text { font-size: 23px; }
      .star-text  { font-size: 20px; }
      .gate-text  { font-size: 20px; }
      .taichi-svg { width: 130px; height: 130px; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/gh/usaleo/oogo-qimen@main/3meta.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/usaleo/oogo-qimen@main/html2canvas.min.js"></script>
  <script src="./oogo-zhirun.js"></script>
</head>
  
<body class="light-theme">

  <div class="top-ctrl">
    <div class="ctrl-row">
      <div class="badge badge-gong">公</div>
      <div class="date-group">
        <div class="date-item year-item"><select id="selY" class="date-input" onchange="updateDynamicInfo()"></select><span class="date-text">年</span></div>
        <div class="date-item"><select id="selM" class="date-input" onchange="updateDynamicInfo()"></select><span class="date-text">月</span></div>
        <div class="date-item"><select id="selD" class="date-input" onchange="updateDynamicInfo()"></select><span class="date-text">日</span></div>
        <div class="date-item"><select id="selH" class="date-input" onchange="updateDynamicInfo()"></select><span class="date-text">时</span></div>
        <div class="date-item"><select id="selMin" class="date-input" onchange="updateDynamicInfo()"></select><span class="date-text">分</span></div>
      </div>
      <button class="btn-red" onclick="setNowTime()">现在</button>
    </div>

    <div class="ctrl-row">
      <div class="badge badge-nong">节</div>
      <div style="flex: 1; background: var(--bg-main); border: 1px solid var(--border-color); height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0 2px; box-sizing: border-box;">
        <div id="jieqiRange" style="white-space: nowrap; font-size: min(11.5px, 2.9vw); font-weight: bold; color: var(--text-main); letter-spacing: -0.2px;">加载节气中...</div>
      </div>
    </div>

    <div class="ctrl-row" style="align-items: stretch; margin-bottom: 0;">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; gap: 8px;">
        <div style="display: flex; gap: 8px; align-items: center; min-width: 0;">
          <div class="badge badge-zhen">真</div>
          <div class="zhen-group">
            <label class="zhen-item" style="flex: 0.8; cursor: pointer;">
              <input type="checkbox" id="useTrueSolar" checked onchange="updateDynamicInfo()">
              <span style="color:var(--text-gray); font-size:11px; white-space:nowrap;">太阳时</span>
            </label>
            <div class="zhen-item" style="flex: 1;">
              <select id="citySelect" onchange="document.getElementById('longitude').value = this.value; updateDynamicInfo()">
                <option value="117.20" selected>天津</option>
                <option value="116.40">北京</option>
                <option value="121.47">上海</option>
              </select>
            </div>
            <div class="zhen-item" style="flex: 0.9;">
              <input type="number" id="longitude" value="117.20" step="0.01" onchange="updateDynamicInfo()">
            </div>
          </div>
        </div>
        <div class="sub-ctrl">
          <div class="sub-text">🧭 起局地真太阳时起局</div>
          <div class="select-group">
            <select id="methodSelect" onchange="onSelectChange()"><option value="zhirun" selected>置闰法</option><option value="chaibu">拆补法</option></select>
            <select id="panSelect" onchange="onSelectChange()"><option value="zhuan" selected>转盘</option><option value="fei">飞盘</option></select>
            <button class="btn-theme" onclick="toggleTheme()">☀️ 主题</button>
          </div>
        </div>
      </div>
      <button class="btn-big-start" onclick="generateChart()">起局</button>
    </div>
  </div>

  <div class="info-board" id="infoBoard"></div>
  <div class="grid" id="chartGrid"></div>

  <script>
    // 适配器
    const OogoAlignAdapter = {
      alignZhuanPan: function(chart) {
        if (!chart || !chart.palaces) return chart;
        let palace5 = chart.palaces.find(p => p.position === 5);
        let palace2 = chart.palaces.find(p => p.position === 2);
        if (palace5 && palace2) {
          let extraStem = palace5.earthlyStem || palace5.heavenlyStem;
          if (extraStem && palace2) {
            if (!Array.isArray(palace2.earthlyStem)) palace2.earthlyStem = [palace2.earthlyStem];
            if (!palace2.earthlyStem.includes(extraStem)) palace2.earthlyStem.push(extraStem);
          }
        }
        return chart;
      }
    };

    function pad(n) { return n < 10 ? '0' + n : n; }

    function initAll() {
        const y = document.getElementById('selY'), m = document.getElementById('selM'), d = document.getElementById('selD'), h = document.getElementById('selH'), min = document.getElementById('selMin');
        if(y) for(let i=1900; i<=2100; i++) y.add(new Option(i, i));
        if(m) for(let i=1; i<=12; i++) m.add(new Option(i, i));
        if(d) for(let i=1; i<=31; i++) d.add(new Option(i, i));
        if(h) for(let i=0; i<=23; i++) h.add(new Option(i, i));
        if(min) for(let i=0; i<=59; i++) min.add(new Option(pad(i), i));
        setNowTime();
        renderDefaultBoard();
    }
    document.addEventListener('DOMContentLoaded', initAll);

    function renderDefaultBoard() {
      const grid = document.getElementById('chartGrid');
      if (grid) grid.innerHTML = '<div style="width:100%; text-align:center; padding:20px;">请点击起局</div>';
    }

    function setNowTime() {
      const now = new Date();
      document.getElementById('selY').value = now.getFullYear();
      document.getElementById('selM').value = now.getMonth() + 1;
      document.getElementById('selD').value = now.getDate();
      document.getElementById('selH').value = now.getHours();
      document.getElementById('selMin').value = now.getMinutes();
      updateDynamicInfo(); 
    }

    function toggleTheme() { document.body.classList.toggle('light-theme'); }
    function onSelectChange() { if(isChartGenerated) generateChart(); }

    function updateDynamicInfo() {
      if (typeof ThreeMeta === 'undefined') return;
      try {
        let yIn = parseInt(document.getElementById('selY').value);
        let mIn = parseInt(document.getElementById('selM').value);
        let dIn = parseInt(document.getElementById('selD').value);
        let hIn = parseInt(document.getElementById('selH').value);
        let minIn = parseInt(document.getElementById('selMin').value);
        let currentTimestamp = new Date(yIn, mIn - 1, dIn, hIn, minIn, 0).getTime();
        
        function getJQAt(ts) {
            let d = new Date(ts);
            return ThreeMeta.QimenChart.fromSolar(d.getFullYear(), d.getMonth()+1, d.getDate(), d.getHours(), d.getMinutes(), 0).timeInfo.solarTerm;
        }
        
        let currentJQ = getJQAt(currentTimestamp);
        let step = 24 * 3600 * 1000; 
        let startProbe = currentTimestamp;
        while (getJQAt(startProbe) === currentJQ) { startProbe -= step; }
        let left = startProbe, right = startProbe + step;
        while (right - left > 60000) { let mid = Math.floor((left + right) / 2); if (getJQAt(mid) === currentJQ) right = mid; else left = mid; }
        let startTime = new Date(right);
        let endProbe = currentTimestamp;
        while (getJQAt(endProbe) === currentJQ) { endProbe += step; }
        let nextJQ = getJQAt(endProbe);
        left = endProbe - step; right = endProbe;
        while (right - left > 60000) { let mid = Math.floor((left + right) / 2); if (getJQAt(mid) === nextJQ) right = mid; else left = mid; }
        let endTime = new Date(right);
        function formatD(d) { return d.getFullYear() + '.' + pad(d.getMonth()+1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
        document.getElementById('jieqiRange').innerHTML = currentJQ + ' ' + formatD(startTime) + '<span style="color:var(--text-gray); margin:0 3px;">~</span>' + nextJQ + ' ' + formatD(endTime);
      } catch (e) { console.error(e); }
    }

    const stems = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const branches = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    function simplifyDeity(name) { return name ? name.replace('值符','符').replace('腾蛇','螣').replace('太阴','阴').replace('六合','合').replace('白虎','白').replace('玄武','玄').replace('九地','地').replace('九天','天').replace('勾陈','勾').replace('太常','常').replace('朱雀','雀') : ''; }
    function getJieQi(m, d) { const terms = { 1: d<5?"冬至":d<20?"小寒":"大寒", 2: d<4?"大寒":d<19?"立春":"雨水", 3: d<5?"雨水":d<20?"惊蛰":"春分", 4: d<5?"春分":d<20?"清明":"谷雨", 5: d<5?"谷雨":d<21?"立夏":"小满", 6: d<6?"小满":d<21?"芒种":"夏至", 7: d<7?"夏至":d<23?"小暑":"大暑", 8: d<7?"大暑":d<23?"立秋":"处暑", 9: d<7?"处暑":d<23?"白露":"秋分", 10: d<8?"秋分":d<23?"寒露":"霜降", 11: d<7?"霜降":d<22?"立冬":"小雪", 12: d<7?"小雪":d<22?"大雪":"冬至" }; return terms[m]; }

    function generateChart() {
      try {
        isChartGenerated = true;
        let yIn = parseInt(document.getElementById('selY').value), mIn = parseInt(document.getElementById('selM').value), dIn = parseInt(document.getElementById('selD').value), hIn = parseInt(document.getElementById('selH').value), minIn = parseInt(document.getElementById('selMin').value);
        let dDate = new Date(yIn, mIn - 1, dIn, hIn, minIn, 0);
        let lng = parseFloat(document.getElementById('longitude').value);
        if (document.getElementById('useTrueSolar').checked && !isNaN(lng)) dDate.setMinutes(dDate.getMinutes() + (lng - 120) * 4);
        const y = dDate.getFullYear(), m = dDate.getMonth() + 1, d = dDate.getDate(), h = dDate.getHours(), min = dDate.getMinutes();
        let method = document.getElementById('methodSelect').value, panType = document.getElementById('panSelect').value;
        let chart, zhirunData = null;

        if (method === 'zhirun') {
          zhirunData = OogoZhiRun.calculate(y, m, d, h, min);
          chart = ThreeMeta.QimenChart.byDatetime(yIn + "-" + pad(mIn) + "-" + pad(dIn) + "T" + pad(hIn) + ":" + pad(minIn) + ":00", { juNumber: zhirunData.juNumber, isYangdun: zhirunData.isYangdun });
          chart.solarTerm = zhirunData.debugInfo.targetJieQi; chart.yuan = zhirunData.debugInfo.yuanName;
        } else {
          chart = ThreeMeta.QimenChart.fromSolar(y, m, d, h, min, 0);
        }

        if (panType === 'fei') chart = OogoFeiPan.fly(chart);
        else if (panType === 'zhuan') chart = OogoAlignAdapter.alignZhuanPan(chart);

        let bY = chart.fourPillars.year.stem + chart.fourPillars.year.branch, bM = chart.fourPillars.month.stem + chart.fourPillars.month.branch, bD = chart.fourPillars.day.stem + chart.fourPillars.day.branch, bH = chart.fourPillars.hour.stem + chart.fourPillars.hour.branch;
        let dSIdx = stems.indexOf(chart.fourPillars.day.stem), dBIdx = branches.indexOf(chart.fourPillars.day.branch), fuOffset = dSIdx % 5;
        let fuTou = stems[dSIdx - fuOffset] + branches[(dBIdx - fuOffset + 12) % 12];
        let maXing = {"申":"寅","子":"寅","辰":"寅", "亥":"巳","卯":"巳","未":"巳", "寅":"申","午":"申","戌":"申", "巳":"亥","酉":"亥","丑":"亥"}[chart.fourPillars.hour.branch];
        let hSIdx = stems.indexOf(chart.fourPillars.hour.stem), hBIdx = branches.indexOf(chart.fourPillars.hour.branch), xunOffset = (hBIdx - hSIdx + 12) % 12;
        let kong1 = branches[(xunOffset + 10) % 12], kong2 = branches[(xunOffset + 11) % 12], xunName = stems[0] + branches[xunOffset], xunDun = {"甲子":"戊", "甲戌":"己", "甲申":"庚", "甲午":"辛", "甲辰":"壬", "甲寅":"癸"}[xunName];
        let zfObj = chart.zhiFu || {}, zsObj = chart.zhiShi || {}, zfPalace = zfObj.position || (chart.palaces.find(p=>p.star === (zfObj.star||'').replace('星',''))||{}).position || 1, zsPalace = zsObj.position || (chart.palaces.find(p=>p.gate === (zsObj.gate||'').replace('门',''))||{}).position || 1;
        let isYang = chart.ju.type.indexOf('阳') !== -1, yuanDay = fuOffset + 1, jqName = (method === 'zhirun' && zhirunData && zhirunData.debugInfo) ? zhirunData.debugInfo.targetJieQi : (chart.jieQi || chart.solarTerm || getJieQi(m, d));
        let runTag = (method === 'zhirun' && zhirunData && zhirunData.debugInfo && zhirunData.debugInfo.isTrueRun) ? '<span style="color:var(--c-gate-r); font-weight:bold; margin-left:2px;">(闰)</span>' : '';
        let yuanStr = (chart.yuan || '中元') + '第' + yuanDay + '天', dunStr = chart.ju.type + chart.ju.number + '局';

        const ring = [1, 8, 3, 4, 9, 2, 7, 6], deities = ['值符', '腾蛇', '太阴', '六合', '白虎', '玄武', '九地', '九天'], eDeities = {};
        if (panType === 'zhuan') {
          let eXunP = chart.palaces.find(p=>(Array.isArray(p.earthlyStem)?p.earthlyStem[0]:p.earthlyStem)===xunDun)?.position || 2;
          let idx = ring.indexOf(eXunP);
          for (let i = 0; i < 8; i++) eDeities[ring[isYang ? (idx + i) % 8 : (idx - i + 8) % 8]] = deities[i];
        }
        let hStemsMap = {}, cP = zsPalace, qStems = ["戊", "己", "庚", "辛", "壬", "癸", "丁", "丙", "乙"], startS = qStems.indexOf(xunDun);
        for(let i=0; i<9; i++) { hStemsMap[cP] = qStems[(startS+i)%9]; cP = isYang ? (cP%9)+1 : (cP===1?9:cP-1); }

        document.getElementById('infoBoard').innerHTML = '<div class="bazi-row"><div class="bazi-box"><div class="bazi-title">年柱</div><div class="bazi-value">'+bY+'</div></div><div class="bazi-box"><div class="bazi-title">月柱</div><div class="bazi-value">'+bM+'</div></div><div class="bazi-box"><div class="bazi-title">日柱</div><div class="bazi-value">'+bD+'</div></div><div class="bazi-box"><div class="bazi-title">时柱</div><div class="bazi-value">'+bH+'</div></div></div><div class="info-row"><span style="display:flex; align-items:center;">'+jqName+runTag+' &nbsp;'+yuanStr+' &nbsp;'+dunStr+'</span><span>符头: '+fuTou+'</span></div><div class="info-row zhifu-row"><span class="pill-green">值符: '+displayZfName+'('+zfPalace+'宫)</span><div class="circle-logo" onclick="exportImage()">历</div><span class="pill-green">值使: '+zsName+'('+zsPalace+'宫)</span></div><div class="info-row"><span style="display:flex; align-items:center;">旬首: '+xunName+'遁'+xunDun+'</span><span>马星: '+maXing+' &nbsp;空亡: '+kong1+','+kong2+'</span></div>';
        let gridHtml = '';
        [4, 9, 2, 3, 5, 7, 8, 1, 6].forEach(pos => {
          const p = chart.palaces.find(x=>x.position===pos)||{};
          let tDeity = simplifyDeity(Array.isArray(p.deity)?p.deity[0]:(p.deity||'')), eDeity = (panType==='zhuan'&&pos!==5)?simplifyDeity(eDeities[pos]):'';
          let starName = (Array.isArray(p.star)?p.star.join(''):(p.star||'')).replace(/天|星/g, ''), gateName = (p.gate||'').replace('门',''), hStem = Array.isArray(p.heavenlyStem)?p.heavenlyStem.join('/'):(p.heavenlyStem||''), eStem = Array.isArray(p.earthlyStem)?p.earthlyStem.join('/'):(p.earthlyStem||'');
          gridHtml += `<div class="cell"><div class="corner top-right"></div><div class="inner-content"><div class="row"><div class="left-item deity deity-text">${tDeity}</div><div class="right-item stem-h">${hStem}</div></div><div class="row"><div class="left-item star star-text">${starName}</div><div class="right-item stem-e">${eStem}</div></div><div class="row"><div class="left-item gate-text">${gateName}</div><div class="right-item edeity-text">${eDeity}</div></div></div><div class="palace-row"><span>${p.trigram||''}${pos}宫</span><span class="hidden-stem-text">${hStemsMap[pos]||''}</span></div></div>`;
        });
        document.getElementById('chartGrid').innerHTML = gridHtml;
      } catch (err) { alert("排盘错误：" + err.message); }
    }

    function exportImage() { /* 截图逻辑保持不变 */ }
    function showToast(msg) { /* Toast逻辑保持不变 */ }
  </script>
</body>
</html>
